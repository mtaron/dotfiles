# In order to push changes that effect ci.yaml, the GitHub CLI needs "workflow" scope,
# e.g. `gh auth login --scopes 'read:packages workflow'`
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install zsh
        run: |
          sudo apt-get update && sudo apt-get install zsh

      - name: chezmoi install
        shell: bash
        run: |
          echo "Install"
          ./install.sh

          echo "home directory"
          ls -a $HOME

          echo "Valdiate that .zshenv is created"
          [[ -f "$HOME/.zshenv" ]]  || exit 1

          echo "config directory"
          ls -a "$HOME/.config"

          echo "Valdiate that git config and .zshrc are created"
          [[ -f "$HOME/.config/git/config" ]] || exit 1
          [[ -f "$HOME/.config/zsh/.zshrc" ]] || exit 1

          echo "Valdiate user email from environment variable"
          email=$(chezmoi data | jq -r '.user.email')
          [[ "$email" == "test@taron.dev" ]] || exit 1
        env:
          GIT_AUTHOR_EMAIL: test@taron.dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: test environment
        run: |
          echo "test aliases and environment variables are set"
          l $ZDOTDIR

          echo "test mise installed and tools are available"
          mise ls
          go version
        shell: zsh --errexit {0}
