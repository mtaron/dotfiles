# https://mise.jdx.dev/configuration/settings.html

[settings]
not_found_auto_install = false

use_versions_host_track = false

lockfile = true
lockfile_platforms = ["linux-x64"]

python.uv_venv_auto = "source"
idiomatic_version_file_enable_tools = ["go", "node", "python"]

[settings.npm]
package_manager = "pnpm"

[settings.github]
credential_command = 'gh auth token --hostname "${MISE_CREDENTIAL_HOST}"'
use_git_credentials = true

[tools]
# languages
go = "latest"
node = "lts"
python = { version = "latest", postinstall = "~/.local/bin/mise sync python --uv" }

# package managers
pnpm = { version = "latest", postinstall = "pnpm setup --no-modify-path --force" }
uv = "latest"

# dev tools
atuin = "latest"
aws = "latest"
bat = "latest"
dive = "latest"
fd = "latest"
fzf = "latest"
hostctl = "latest"
jq = "latest"
mkcert = "latest"
ripgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
task = "latest"
yq = "latest"
zoxide = "latest"

"github:temporalio/cli" = "latest"

# kubernetes
helm = "latest"
helm-diff = { version = "latest", filter_bins = "helm-diff", depends = ["helm"], postinstall = "helm plugin uninstall diff >/dev/null 2>&1 || true; helm plugin install $MISE_TOOL_INSTALL_PATH/diff" }  # required for helmfile
helmfile = "latest"
kind = "latest"
kubectl = "latest"
tilt = "latest"

# infrastructure as code
opentofu = "latest"
terragrunt = "latest"
